# /opt/zextras/data/tmp is java.io.tmpdir for the Carbonio JVMs started via
# zmjava/zmpython (configd, CLI tools). The OpenTelemetry eBPF (OBI) java
# agent unpacks jars there and deletes them while the JVM still holds them
# open, so needrestart would flag carbonio-configd.service on every
# apt/dpkg transaction (CO-4287). Treat it like needrestart treats /tmp.
$nrconf{blacklist_mappings} = [
    @{$nrconf{blacklist_mappings}},
    qr#^/opt/zextras/data/tmp/#,
];
$nrconf{blacklist_interp} = [
    @{$nrconf{blacklist_interp}},
    qr#^/opt/zextras/data/tmp/#,
];
